<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f1e;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.15" />
      <stop offset="70%" style="stop-color:#6366f1;stop-opacity:0" />
    </radialGradient>
    
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <ellipse cx="600" cy="315" rx="400" ry="400" fill="url(#glow)"/>
  
  <!-- Crosshair Logo -->
  <g id="logo" transform="translate(600, 160)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="65" fill="none" stroke="#00ff88" stroke-width="3" opacity="0.3"/>
    
    <!-- Main circle -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#00ff88" stroke-width="5"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.5"/>
    
    <!-- Crosshair lines -->
    <line x1="-80" y1="0" x2="-58" y2="0" stroke="#00ff88" stroke-width="5" stroke-linecap="round"/>
    <line x1="58" y1="0" x2="80" y2="0" stroke="#00ff88" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="-80" x2="0" y2="-58" stroke="#00ff88" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="58" x2="0" y2="80" stroke="#00ff88" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Corner brackets -->
    <path d="M -35 -35 L -35 -45 M -35 -35 L -45 -35" stroke="#00ff88" stroke-width="3" stroke-linecap="round"/>
    <path d="M 35 -35 L 35 -45 M 35 -35 L 45 -35" stroke="#00ff88" stroke-width="3" stroke-linecap="round"/>
    <path d="M -35 35 L -35 45 M -35 35 L -45 35" stroke="#00ff88" stroke-width="3" stroke-linecap="round"/>
    <path d="M 35 35 L 35 45 M 35 35 L 45 35" stroke="#00ff88" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Center dot -->
    <circle cx="0" cy="0" r="8" fill="#00ff88">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Badge -->
  <rect x="460" y="270" width="280" height="44" rx="22" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.8"/>
  <rect x="462" y="272" width="276" height="40" rx="20" fill="#6366f1" opacity="0.15"/>
  <text x="600" y="299" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#a5b4fc" text-anchor="middle" letter-spacing="2">✨ PRO CALCULATOR</text>
  
  <!-- Title Line 1 -->
  <text x="600" y="365" font-family="Arial, sans-serif" font-size="85" font-weight="800" fill="#00ff88" text-anchor="middle" letter-spacing="-1">CS2 PSA</text>
  
  <!-- Title Line 2 -->
  <text x="600" y="445" font-family="Arial, sans-serif" font-size="85" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">Calculator Ultra</text>
  
  <!-- Subtitle -->
  <text x="600" y="500" font-family="Arial, sans-serif" font-size="30" font-weight="500" fill="#94a3b8" text-anchor="middle">Encuentra tu sensibilidad perfecta en 7 iteraciones</text>
  
  <!-- Features -->
  <g id="features" transform="translate(0, 540)">
    <!-- Feature 1 -->
    <g transform="translate(280, 0)">
      <circle cx="0" cy="0" r="14" fill="#00ff88"/>
      <text x="0" y="6" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f0f1e" text-anchor="middle">✓</text>
      <text x="28" y="6" font-family="Arial, sans-serif" font-size="24" font-weight="500" fill="#e2e8f0">Algoritmo Adaptativo</text>
    </g>
    
    <!-- Feature 2 -->
    <g transform="translate(560, 0)">
      <circle cx="0" cy="0" r="14" fill="#00ff88"/>
      <text x="0" y="6" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f0f1e" text-anchor="middle">✓</text>
      <text x="28" y="6" font-family="Arial, sans-serif" font-size="24" font-weight="500" fill="#e2e8f0">100+ Pros</text>
    </g>
    
    <!-- Feature 3 -->
    <g transform="translate(730, 0)">
      <circle cx="0" cy="0" r="14" fill="#00ff88"/>
      <text x="0" y="6" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f0f1e" text-anchor="middle">✓</text>
      <text x="28" y="6" font-family="Arial, sans-serif" font-size="24" font-weight="500" fill="#e2e8f0">100% Gratis</text>
    </g>
  </g>
  
  <!-- Glow effects -->
  <defs>
    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <circle cx="600" cy="160" r="12" fill="#00ff88" opacity="0.8" filter="url(#glowFilter)"/>
</svg>
